query chatMessage($chatId: String!, $messageId: String!) {
  chatMessage(chatId: $chatId, messageId: $messageId) {
    ...ChatMessage_
  }
}

query chatMessages($chatId: String!, $token: String) {
  chatMessages(chatId: $chatId, token: $token) {
    ...ChatMessageNoNesting
  }
}

fragment ChatMessageNoNesting on ChatMessage {
  id
  createdAt
  role
  pageUrl
  success
  usage {
    inputTokens
    cachedTokens
    outputTokens
  }
  content
  replyToId
}

fragment ChatMessage_ on ChatMessage {
  ...ChatMessageNoNesting
}

mutation CreateChatToken {
  createChatToken(data: {})
}

mutation SendChatMessage($data: ChatMessageSendDataInput!) {
  sendChatMessage(data: $data) {
    id
    success
    content
    usage {
      inputTokens
      cachedTokens
      outputTokens
    }
  }
}
